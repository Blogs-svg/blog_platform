<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kirish — Blog Platformasi</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="/index.html" class="logo">Qalam<span>Blog</span></a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main>
    <div class="container">
      <div class="form-card">
        <h2 style="font-family: var(--font-serif); margin-top:0;">Tizimga kirish</h2>

        <div id="alert-box" class="alert"></div>

        <form id="login-form">
          <div class="form-group">
            <label for="username">Foydalanuvchi nomi yoki email</label>
            <input type="text" id="username" required>
          </div>
          <div class="form-group">
            <label for="password">Parol</label>
            <input type="password" id="password" required>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Kirish</button>
        </form>

        <div class="form-footer">
          Akkountingiz yo'qmi? <a href="/register.html">Ro'yxatdan o'tish</a>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/main.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });
      const data = await res.json();

      if (!res.ok) {
        showAlert('alert-box', data.error || "Xatolik yuz berdi.");
        return;
      }

      window.location.href = '/dashboard.html';
    });
  </script>
</body>
</html>
