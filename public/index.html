<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bosh sahifa — Blog Platformasi</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="/index.html" class="logo">Qalam<span>Blog</span></a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main>
    <div class="container">
      <h1 class="page-title">So'nggi maqolalar</h1>
      <p class="page-subtitle">Foydalanuvchilar tomonidan yozilgan qiziqarli postlar</p>

      <div id="posts-list"></div>
    </div>
  </main>

  <script src="/js/main.js"></script>
  <script>
    async function loadPosts() {
      const res = await fetch('/api/posts');
      const posts = await res.json();
      const container = document.getElementById('posts-list');

      if (posts.length === 0) {
        container.innerHTML = `<div class="empty-state">Hozircha postlar yo'q. Birinchi bo'lib siz yozing!</div>`;
        return;
      }

      container.innerHTML = posts.map(p => `
        <a href="/post.html?id=${p.id}" style="display:block;">
          <div class="post-card">
            <h2>${escapeHtml(p.title)}</h2>
            <div class="post-meta">${escapeHtml(p.author)} · ${formatDate(p.createdAt)}</div>
            <div class="post-excerpt">${escapeHtml(p.content.slice(0, 160))}${p.content.length > 160 ? '…' : ''}</div>
          </div>
        </a>
      `).join('');
    }

    loadPosts();
  </script>
</body>
</html>
