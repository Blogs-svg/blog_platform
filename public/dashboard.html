<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mening postlarim — Blog Platformasi</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <a href="/index.html" class="logo">Qalam<span>Blog</span></a>
      <div class="nav-links" id="nav-links"></div>
    </div>
  </nav>

  <main>
    <div class="container" id="dashboard-content" style="display:none;">

      <h1 class="page-title" id="form-title">Yangi post yozish</h1>
      <p class="page-subtitle">Fikringizni dunyo bilan bo'lishing</p>

      <div id="alert-box" class="alert"></div>

      <div class="form-card" style="max-width: 100%; margin-bottom: 40px;">
        <form id="post-form">
          <input type="hidden" id="post-id">
          <div class="form-group">
            <label for="title">Sarlavha</label>
            <input type="text" id="title" required>
          </div>
          <div class="form-group">
            <label for="content">Matn</label>
            <textarea id="content" required></textarea>
          </div>
          <div style="display:flex; gap:10px;">
            <button type="submit" class="btn btn-primary" id="submit-btn">Nashr qilish</button>
            <button type="button" class="btn btn-outline" id="cancel-edit" style="display:none;">Bekor qilish</button>
          </div>
        </form>
      </div>

      <h2 style="font-family: var(--font-serif); font-size: 22px;">Mening postlarim</h2>
      <div id="my-posts-list"></div>

    </div>

    <div id="not-logged-in" class="container empty-state" style="display:none;">
      Bu sahifani ko'rish uchun <a href="/login.html" style="color: var(--accent); font-weight:600;">tizimga kiring</a>.
    </div>
  </main>

  <script src="/js/main.js"></script>
  <script>
    let editingId = null;

    async function init() {
      const user = await getSession();
      if (!user) {
        document.getElementById('not-logged-in').style.display = 'block';
        return;
      }
      document.getElementById('dashboard-content').style.display = 'block';
      await loadMyPosts();

      // Agar URL orqali edit=... berilgan bo'lsa, formani to'ldirish
      const params = new URLSearchParams(window.location.search);
      const editId = params.get('edit');
      if (editId) {
        const res = await fetch(`/api/posts/${editId}`);
        if (res.ok) {
          const post = await res.json();
          if (post.authorId === user.id) startEdit(post);
        }
      }
    }

    async function loadMyPosts() {
      const res = await fetch('/api/my-posts');
      const posts = await res.json();
      const container = document.getElementById('my-posts-list');

      if (posts.length === 0) {
        container.innerHTML = `<div class="empty-state">Siz hali post yozmagansiz.</div>`;
        return;
      }

      container.innerHTML = posts.map(p => `
        <div class="my-post-row">
          <div>
            <h3><a href="/post.html?id=${p.id}">${escapeHtml(p.title)}</a></h3>
            <div class="post-meta">${formatDate(p.createdAt)}</div>
          </div>
          <div class="row-actions">
            <button class="edit-btn" onclick='editPost(${JSON.stringify(p.id)})'>Tahrirlash</button>
            <button class="delete-btn" onclick='deletePost(${JSON.stringify(p.id)})'>O'chirish</button>
          </div>
        </div>
      `).join('');
    }

    window.editPost = async function(id) {
      const res = await fetch(`/api/posts/${id}`);
      const post = await res.json();
      startEdit(post);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    function startEdit(post) {
      editingId = post.id;
      document.getElementById('form-title').textContent = 'Postni tahrirlash';
      document.getElementById('title').value = post.title;
      document.getElementById('content').value = post.content;
      document.getElementById('submit-btn').textContent = 'Saqlash';
      document.getElementById('cancel-edit').style.display = 'inline-block';
    }

    function resetForm() {
      editingId = null;
      document.getElementById('form-title').textContent = 'Yangi post yozish';
      document.getElementById('post-form').reset();
      document.getElementById('submit-btn').textContent = 'Nashr qilish';
      document.getElementById('cancel-edit').style.display = 'none';
      history.replaceState(null, '', '/dashboard.html');
    }

    document.getElementById('cancel-edit').addEventListener('click', resetForm);

    window.deletePost = async function(id) {
      if (!confirm("Ushbu postni o'chirishni tasdiqlaysizmi?")) return;
      const res = await fetch(`/api/posts/${id}`, { method: 'DELETE' });
      if (res.ok) {
        loadMyPosts();
      } else {
        alert("O'chirishda xatolik yuz berdi.");
      }
    };

    document.getElementById('post-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('title').value.trim();
      const content = document.getElementById('content').value.trim();

      const url = editingId ? `/api/posts/${editingId}` : '/api/posts';
      const method = editingId ? 'PUT' : 'POST';

      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, content })
      });
      const data = await res.json();

      if (!res.ok) {
        showAlert('alert-box', data.error || 'Xatolik yuz berdi.');
        return;
      }

      resetForm();
      loadMyPosts();
    });

    init();
  </script>
</body>
</html>
